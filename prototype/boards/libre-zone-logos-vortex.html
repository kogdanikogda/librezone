<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap">
<style>
:root{--bg:#F5F3FB;--card:#FFFFFF;--t:#16122B;--t2:#5F5978;--line:#E9E5F4;--accent:#6535F5;--soft:#EEE8FF;--field:#F1EEF9;--grad:linear-gradient(135deg,#4F2BFF 0%,#8349FF 50%,#D447D6 100%);--fd:"Manrope","Inter",system-ui,sans-serif;--font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--sw:4.5}

:root[data-theme="dark"]{--bg:#0F0D1A;--card:#191628;--t:#F2F0FA;--t2:#A39DBD;--line:#2C2742;--accent:#A58BFF;--soft:#2A2250;--field:#231F38;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--t);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 72px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
h1{font-size:32px;line-height:1.15;font-weight:800}
h3{font-size:17px;font-weight:800}
p{margin:0;text-wrap:pretty}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.intro{display:flex;flex-direction:column;gap:10px;max-width:780px}
.lead{color:var(--t2);font-size:16px}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.lab{font-size:12px;color:var(--t2);font-weight:600;margin-right:8px}
.seg{display:inline-flex;background:var(--field);border-radius:12px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--t2);padding:6px 12px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--t);box-shadow:0 1px 3px rgba(40,20,120,.14)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card p{font-size:13px;color:var(--t2)}
.hd{display:flex;gap:10px;align-items:baseline}
.hd i{font-style:normal;font-weight:800;font-family:var(--fd);color:var(--accent);font-size:13px}
.stage{background:var(--soft);border-radius:18px;height:176px;display:grid;place-items:center;color:var(--accent)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tile{background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.lock{display:flex;align-items:center;gap:8px;border-radius:14px;padding:10px 12px;font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.lock b{color:#6535F5;font-weight:800}
.lock.l{background:#F6F4FC;color:#1B1730}
.lock.d{background:#14112A;color:#fff}.lock.d b{color:#B7A2FF}
.lock .tile{width:26px;height:26px;border-radius:8px}
svg.m{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:var(--sw)}
.sizes{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}.sizes>div{justify-content:flex-end}
.sizes small{display:block;font-size:11px;color:var(--t2);text-align:center;margin-top:4px}
.sizes div{display:flex;flex-direction:column;align-items:center}
.cur{outline:2px dashed var(--line);outline-offset:-2px}
</style>

  <h1>Вихрь вместо монограммы</h1>
  <p class="lead">Восемь знаков на тему спирали и водоворота: закрученные, местами неровные, с характером «живого» потока. Все нарисованы с нуля, без заимствования чужих знаков. Первой для сравнения стоит нынешняя монограмма LZ.</p>
 </div>
